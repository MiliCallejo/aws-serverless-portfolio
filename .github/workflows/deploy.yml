name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Debug OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::461837196439:role/PortfolioGitHubActionsRole
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://milagros-callejo-portfolio-aws --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2I8HVMXS6A506 --paths "/*"